# Backing services for local development. Ports bind to loopback only.
# Production adds TLS and the app containers: see docker-compose.prod.yml.
name: rkl

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rkl
      POSTGRES_PASSWORD: ${RKL_DB_PASSWORD:-rkl}
      POSTGRES_DB: rkl
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rkl -d rkl"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6390:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db:
  redis:
