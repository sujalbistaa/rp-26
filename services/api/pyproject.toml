[project]
name = "rkl-api"
version = "1.0.0"
description = "Rourkela Police face match portal: API and ML pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.6",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.17",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=43",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10",
  "onnxruntime-gpu>=1.20; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "onnxruntime>=1.20; sys_platform != 'linux' or platform_machine != 'x86_64'",
  "scikit-learn>=1.5",
  "pillow>=11",
  "pillow-heif>=0.20",
  "boto3>=1.35",
  "redis>=5.2",
  "rq>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/db/migrations/versions/*" = ["E501"]
